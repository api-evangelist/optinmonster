aid: optinmonster
name: OptinMonster
description: >-
  OptinMonster is a lead-generation and conversion-optimization SaaS from Awesome Motive that
  serves on-site campaigns — popups, floating bars, slide-ins, fullscreen fills, inline forms and
  gamified spin-to-win wheels — targeted by display rules such as Exit Intent, page-level
  targeting, geolocation, referrer and on-site behavior. Campaigns are built in a hosted visual
  builder at app.optinmonster.com and rendered on customer sites by a JavaScript embed served from
  the a.omappapi.com CDN. The platform exposes a private-key REST API at api.optinmonster.com
  (v1 and v2) and a mirror at api.omwpapi.com used by the first-party WordPress plugin, covering
  campaigns, leads, sites, integrations, revenue attribution and templates; a client-side
  JavaScript Events API of roughly sixty `om.*` lifecycle events for hooking campaign display,
  conversion and analytics; and an outbound webhook that POSTs captured lead data to a customer
  endpoint. Leads are routed to more than sixty marketing platforms through built-in integrations.
