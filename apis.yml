apis:
- aid: optinmonster-rest-api
  name: OptinMonster REST API
  description: >-
    The OptinMonster application REST API. Versioned path segments (`/v1`, `/v2`) sit on
    api.optinmonster.com and cover campaigns, leads, sites, site origins, integrations, account,
    revenue attribution and the public template catalog. Authenticated with an account API key
    supplied in the `X-OptinMonster-ApiKey` header (legacy `omapi-key` + user pairing is still
    accepted). Responses are JSON; errors use a consistent
    `{error, code, message, status}` envelope with numeric OptinMonster codes.
  humanURL: https://optinmonster.com/docs/
  baseURL: https://api.optinmonster.com/v2
  tags:
  - Lead Generation
  - Campaigns
  - Marketing
  properties:
  - type: Authentication
    url: authentication/optinmonster-authentication.yml
  - type: ErrorCatalog
    url: errors/optinmonster-problem-types.yml
  - type: Conventions
    url: conventions/optinmonster-conventions.yml
  - type: RateLimits
    url: rate-limits/optinmonster-rate-limits.yml
  - type: DataModel
    url: data-model/optinmonster-data-model.yml
- aid: optinmonster-wordpress-plugin-api
  name: OptinMonster WordPress Plugin API
  description: >-
    The API host the first-party OptinMonster WordPress plugin calls (`OPTINMONSTER_API_URL`).
    Serves the same versioned surface and error envelope as api.optinmonster.com — `v1/optins`,
    `v1/verify`, `v2/sites`, `v2/sites/origin`, `v2/sites/{siteId}`, `v2/key/regenerate` and
    `v2/revenue/{accountId}` — and additionally accepts the `OMAPI-Referer`, `OMAPI-Sender`,
    `OMAPI-Site`, `OMAPI-Version` and `OMAPI-Plugins` context headers the plugin sends.
  humanURL: https://wordpress.org/plugins/optinmonster/
  baseURL: https://api.omwpapi.com
  tags:
  - WordPress
  - Lead Generation
  properties:
  - type: SourceCode
    url: https://plugins.svn.wordpress.org/optinmonster/trunk/
  - type: ChangeLog
    url: https://plugins.svn.wordpress.org/optinmonster/trunk/CHANGELOG.md
- aid: optinmonster-javascript-events-api
  name: OptinMonster JavaScript Events API
  description: >-
    A client-side event API exposed by the OptinMonster embed script (served from
    a.omappapi.com/app/js/api.min.js). Roughly sixty documented `om.*` events fire across campaign
    initialization, display-rule evaluation, show/close, view changes, form validation, conversion
    success/error, analytics impressions and conversions, and campaign actions. Handlers are bound
    with `document.addEventListener` and receive the campaign object, letting integrators suppress
    campaigns, mutate markup, or forward conversions to their own analytics.
  humanURL: https://optinmonster.com/docs/optinmonster-javascript-events-api/
  baseURL: https://a.omappapi.com
  tags:
  - JavaScript
  - Event
  - Embedded
  tags_raw:
  - JavaScript
  - Events
  - Embedded
  properties:
  - type: Components
    url: components/optinmonster-components.yml
