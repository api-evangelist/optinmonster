note: >-
  OptinMonster's primary developer surface is not the REST API — it is a client-side embed. The
  loader script renders hosted campaigns into the customer's page and exposes a large DOM event
  API for hooking their lifecycle. This is the component family developers actually integrate
  against, and it is the best-documented part of the platform.
families:
- name: Campaign embed loader
  kind: script-tag
  description: >-
    The single loader script that bootstraps OptinMonster on a customer site. It fetches the
    account's campaigns, evaluates display rules client-side, and renders popups, floating bars,
    slide-ins, fullscreen fills, inline forms and gamified wheels.
  loader:
    url: https://a.omappapi.com/app/js/api.min.js
    admin_url: https://a.omwpapi.com/app/js/api.min.js
    async: true
    versioned: false
    http_status: 200
    size_bytes: 46243
    build: 'Thu, 06 Aug 2026 17:29:04 GMT'
    fetched: '2026-08-12'
  note: >-
    The loader URL carries no version segment — every site executes whatever build the CDN
    currently serves, with no way to pin. See packages/optinmonster-packages.yml.
  global: om
- name: JavaScript Events API
  kind: dom-events
  description: >-
    Approximately sixty documented `om.*` events dispatched on `document`, bound with
    `document.addEventListener`. Handlers receive the campaign object and can suppress a campaign,
    mutate its markup, or forward conversions to third-party analytics.
  docs: https://optinmonster.com/docs/optinmonster-javascript-events-api/
  binding: document.addEventListener('om.Campaign.show', handler)
  groups:
  - group: initialization
    events:
    - om.Api.init
    - om.Main.init
    - om.Main.parseCampaigns
    - om.Campaigns.init
