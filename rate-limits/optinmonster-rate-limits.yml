note: >-
  OptinMonster publishes no rate limits for its REST API, and returns no rate-limit signal at
  runtime. This is an honest zero, verified two ways rather than assumed: (1) the help centre has
  no rate-limit, quota or throttling article — the developer-facing "Extending" category covers
  only the JavaScript Events API, Dynamic Text Replacement and custom JS/CSS; (2) repeated live
  requests to both an anonymous endpoint and an authenticated-gated endpoint returned no
  `X-RateLimit-*`, no `RateLimit-*`, and no `Retry-After` header, and never produced a 429. An
  agent integrating this API has no runtime signal to back off on and must treat throttling as
  unobservable.
